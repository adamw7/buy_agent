# Hands the host's NVIDIA GPUs to the model server; layered over compose.yaml:
#
#   docker compose -f compose.yaml -f compose.gpu.yaml up -d --build
#
# Needs the NVIDIA Container Toolkit on the host.
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
