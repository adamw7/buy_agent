[pytest]
pythonpath = .
testpaths = tests
addopts = -q --strict-markers

# A deprecation warning is a green run today and a broken one whenever the
# dependency it comes from finishes the job, so it is an error here rather than a
# block of text at the end of a passing run that nobody scrolls to. Every direct
# dependency is pinned to an exact version, which makes the day this fails the day
# somebody deliberately moved one -- which is the moment to fix the call, not
# months later. It reaches `integration/` too, where the model server is
# deliberately unpinned (ADR-0026).
#
# A warning raised inside a dependency, about something it does to itself, is not
# ours to fix: that one gets an `ignore` line here naming the message and the
# module, and a comment saying which upgrade removes it again.
filterwarnings =
    error::DeprecationWarning
    error::PendingDeprecationWarning

# Nothing in either suite sleeps, and the whole of `tests/` runs in about eight
# seconds -- so a test still running a minute later is not a slow test, it is a
# stopped one: a fetch that reached the real web because a patch was spelt wrong,
# a socket the server tests are waiting on, a lock two threads are each holding
# half of. Left alone, that is a job sitting at 4% until GitHub's own six-hour cap
# kills it with no output, and a local run that has to be found and killed by
# hand. Sixty seconds is two orders of magnitude over the slowest test there is
# (~1.5s, spawning a real interpreter), so no slow runner ever reaches it, and a
# hung one is a red run that names itself.
#
# It reaches `integration/` too, where a real model on a CPU needs longer than
# any of this: `integration/conftest.py` marks those with a budget of their own,
# under the five minutes the nightly job caps itself at (ADR-0026) so a stuck
# model server is a failing test rather than a cancelled job with nothing in it.
#
# How a timeout arrives is the platform's: on Linux it is SIGALRM, so the test
# fails and the rest of the run still reports. Windows has no SIGALRM, so
# pytest-timeout dumps every thread's stack and takes the process with it. Both
# are red and both name the test, which is what this is for.
timeout = 60
