[pytest]
pythonpath = .
testpaths = tests
addopts = -q --strict-markers

# Every dependency is pinned, so a deprecation fails the run that moved a pin. A
# warning a dependency raises about itself gets an `ignore` line naming the message,
# the module and the upgrade that removes it. Reaches `integration/` too.
filterwarnings =
    error::DeprecationWarning
    error::PendingDeprecationWarning

# Nothing sleeps, so a test running a minute is stopped, not slow. The live tests
# take their own budget in `integration/conftest.py` (ADR-0026).
timeout = 60
