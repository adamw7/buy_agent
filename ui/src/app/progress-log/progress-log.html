<section class="card log" [class.running]="running()">
  <header>
    <h2 class="caps">Progress</h2>
    <div class="state">
      @if (running()) {
        <span class="pill working"
          ><span class="dot blinking"></span>working · {{ elapsed() }}</span
        >
      } @else {
        <span class="pill">{{ summary() }}</span>
      }

      <!-- Beside the line count, not in the error banner: the file is the log, and
           this is where the log is. -->
      @if (keepable()) {
        <button type="button" class="secondary small save" (click)="download()">
          Download log
        </button>
      }
    </div>
  </header>

  <div class="scroller" #scroller role="log" aria-live="polite" (scroll)="follow($event)">
    @for (line of lines(); track $index) {
      <p class="line" [class.warn]="line.level === 'WARNING'" [class.bad]="line.level === 'ERROR'">
        <span class="at">{{ line.time }}</span>
        <span class="source">{{ shortName(line.logger) }}</span>
        <!-- The word, where the line is one of the two the panel colours. A
             colour is the whole of what said so, which is nothing at all to a
             reader who cannot see it and nothing to a screenshot in black and
             white -- and the file this panel hands over has had the level in
             every line all along. -->
        @if (marked(line.level); as level) {
          <span class="level">{{ level }}</span>
        }
        <span class="message">{{ line.message }}</span>
      </p>
    } @empty {
      <p class="line idle">{{ nothingYet() }}</p>
    }
  </div>
</section>
