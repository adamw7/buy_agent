name: Mutation testing (UI)

on:
  schedule:
    # 06:23 UTC on Saturdays, an hour after mutation.yml (ADR-0016, ADR-0061).
    - cron: "23 6 * * 6"
  workflow_dispatch:

concurrency:
  # A workflow of its own so mutmut's report never waits on Stryker's 90 minutes.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stryker:
    name: Stryker (Node 24)
    runs-on: ubuntu-latest
    # About 1031 mutants and 100 minutes; three hours guards a hung mutant.
    timeout-minutes: 180
    defaults:
      run:
        # pipefail, so the report's pipe fails with its left-hand side.
        shell: bash
        working-directory: ui

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # For the stdlib report script, which decides whether the run passed.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: npm ci

      # Settings are in ui/stryker.config.mjs; the report's floor fails the job.
      - name: Run mutation testing
        run: npx stryker run

      - name: Report
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          python scripts/mutation_report.py ui/reports/mutation/mutation.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-ui
          path: ui/reports/mutation/
