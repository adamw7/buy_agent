name: Release

on:
  release:
    types: [published]
  # Re-run an existing release, for when an upload failed.
  workflow_dispatch:
    inputs:
      tag:
        description: The tag of an existing release to package, e.g. v1.2.0
        required: true

concurrency:
  # Per tag and never cancelled: a half-uploaded release looks finished.
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Every job checks out the release's tag, not main.
  TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}

jobs:
  tested:
    # Nothing is packaged from a commit ci.yml has not passed: neither job below
    # runs the suites, and a tag can name any commit (ADR-0082).
    name: CI passed on the tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reading ci.yml's runs for the tag's commit.
      actions: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Find a passing CI run for the tag's commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
          passed="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&status=success" \
            --jq .total_count)"

          if [ "$passed" -eq 0 ]; then
            echo "::error::CI has not passed on $sha, the commit $TAG names." \
              "Run the CI workflow on $TAG and re-run this release once it is green." >&2
            exit 1
          fi
          echo "CI passed on $sha ($passed run(s))."

  archive:
    # Linux only: the archive is the same bytes from any runner.
    name: Archive (Node 24.22.0, Python 3.15)
    needs: tested
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Attesting provenance: a token naming this run, and the right to file it.
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash

    env:
      # Where server.DEFAULT_UI_DIR looks, as the Dockerfile's COPY does.
      UI_DIST: ui/dist/ui/browser
      PORT: "8123"

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Build the UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Assemble the archive
        run: |
          name="buy-agent-${TAG#v}"
          echo "NAME=$name" >> "$GITHUB_ENV"

          # Which build this is, as buy_agent.version reads it (ADR-0083).
          printf '%s\n%s\n' "${TAG#v}" "$(git rev-parse HEAD)" > buy_agent/_version.txt

          mkdir -p "dist/$name/$UI_DIST"
          cp -r buy_agent "dist/$name/"
          cp -r "$UI_DIST/." "dist/$name/$UI_DIST/"
          cp -r docs "dist/$name/"
          cp requirements.txt README.md LICENSE "dist/$name/"
          # Do not ship bytecode compiled by this runner.
          find "dist/$name" -name __pycache__ -type d -prune -exec rm -rf {} +

          test -f "dist/$name/$UI_DIST/index.html" || {
            echo "the UI build did not land in the archive" >&2
            exit 1
          }

      # Start the archive itself: /api/config is Python, / is the built UI.
      - name: Check the archive serves
        working-directory: dist/${{ env.NAME }}
        run: |
          pip install --disable-pip-version-check -r requirements.txt
          PYTHONPATH=. python -m buy_agent.server --port "$PORT" > server.log 2>&1 &
          server=$!

          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$PORT/api/config" > /dev/null; then
              break
            fi
            sleep 1
          done

          status=0
          curl -fsS "http://127.0.0.1:$PORT/api/config" > config.json || status=1
          curl -fsS "http://127.0.0.1:$PORT/" > /dev/null || status=1
          kill "$server" 2>/dev/null || true
          # The stamp landed: the server says the release's number, not `dev`.
          python -c 'import json, sys; sys.exit(not json.load(open("config.json"))["version"].startswith(sys.argv[1] + "+"))' \
            "${TAG#v}" || { echo "the archive does not say it is ${TAG#v}" >&2; status=1; }

          if [ "$status" -ne 0 ]; then
            echo "the packaged server did not answer:" >&2
            cat server.log >&2
          fi
          rm -f server.log config.json
          exit "$status"

      - name: Pack it
        working-directory: dist
        run: |
          tar -czf "$NAME.tar.gz" "$NAME"
          zip -qr "$NAME.zip" "$NAME"
          sha256sum "$NAME.tar.gz" "$NAME.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The sums say the bytes arrived intact; this says which run of which
      # commit made them, which a sums file beside the archive cannot.
      - name: Attest the archive
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/${{ env.NAME }}.tar.gz
            dist/${{ env.NAME }}.zip

      # --clobber lets a re-run replace the assets.
      - name: Upload the assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            "dist/$NAME.tar.gz" "dist/$NAME.zip" dist/SHA256SUMS.txt \
            --clobber --repo "$GITHUB_REPOSITORY"

  image:
    # The web tier as an image (ADR-0015); nothing else builds the Dockerfile.
    name: Container image
    needs: tested
    runs-on: ubuntu-latest
    permissions:
      # Write only to attach the SBOM to the release, as the archive job does.
      contents: write
      packages: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Log in to ghcr.io
        run: echo "${{ github.token }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build the image
        run: |
          # Registry paths are lowercase.
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${TAG#v}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

          revision="$(git rev-parse HEAD)"

          # Which build this is, to the server (ADR-0083) and to the registry:
          # `source` is also what links the ghcr package to this repository.
          docker build -t "$image:$version" \
            --build-arg VERSION="$version" \
            --build-arg REVISION="$revision" \
            --label org.opencontainers.image.version="$version" \
            --label org.opencontainers.image.revision="$revision" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.created="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .

      # Smoke-test the image before publishing it.
      - name: Check the image serves
        run: |
          docker run --rm -d -p 8000:8000 --name buy-agent-smoke "$IMAGE:$VERSION"

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/config > /dev/null; then
              break
            fi
            sleep 1
          done

          status=0
          curl -fsS http://127.0.0.1:8000/api/config > config.json || status=1
          curl -fsS http://127.0.0.1:8000/ > /dev/null || status=1
          # The build arguments landed: the server says the release's number.
          python3 -c 'import json, sys; sys.exit(not json.load(open("config.json"))["version"].startswith(sys.argv[1] + "+"))' \
            "$VERSION" || { echo "the image does not say it is $VERSION" >&2; status=1; }
          rm -f config.json
          if [ "$status" -ne 0 ]; then
            echo "the image did not serve:" >&2
            docker logs buy-agent-smoke >&2
          fi
          docker rm -f buy-agent-smoke > /dev/null
          exit "$status"

      # Before the push, so an image that fails is never published. The OS
      # layer only: Python packages are pip-audit's, nightly (ADR-0062). Only
      # fixed findings fail, because a rebuild on the moving base tag is the
      # one remedy a release has -- an unfixed one would fail every release
      # until Debian ships a patch, and a gate that is always red is ignored.
      - name: Scan the image
        uses: anchore/scan-action@v7
        with:
          image: ${{ env.IMAGE }}:${{ env.VERSION }}
          config: .github/grype.yaml
          severity-cutoff: high
          only-fixed: "true"
          output-format: table

      - name: List what is in it
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ env.VERSION }}
          format: spdx-json
          output-file: buy-agent-${{ env.VERSION }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # `latest` follows full releases only, never a manual re-run.
      - name: Push it
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          docker push "$IMAGE:$VERSION"

          if [ "$PRERELEASE" = "false" ]; then
            docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi

          # The registry's digest is what an attestation names, not a tag.
          ref="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")"
          echo "DIGEST=${ref#*@}" >> "$GITHUB_ENV"

      # After the push, because the digest exists only once the registry has it.
      - name: Attest the image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true

      - name: Upload the SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" "buy-agent-$VERSION.spdx.json" \
            --clobber --repo "$GITHUB_REPOSITORY"
