name: Release

on:
  release:
    types: [published]
  # Re-run an existing release, for when an upload failed.
  workflow_dispatch:
    inputs:
      tag:
        description: The tag of an existing release to package, e.g. v1.2.0
        required: true

concurrency:
  # Per tag and never cancelled: a half-uploaded release looks finished.
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Every job checks out the release's tag, not main.
  TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}

jobs:
  archive:
    # Linux only: the archive is the same bytes from any runner.
    name: Archive (Node 22.23.3, Python 3.14)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    env:
      # Where server.DEFAULT_UI_DIR looks, as the Dockerfile's COPY does.
      UI_DIST: ui/dist/ui/browser
      PORT: "8123"

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Build the UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Assemble the archive
        run: |
          name="buy-agent-${TAG#v}"
          echo "NAME=$name" >> "$GITHUB_ENV"

          mkdir -p "dist/$name/$UI_DIST"
          cp -r buy_agent "dist/$name/"
          cp -r "$UI_DIST/." "dist/$name/$UI_DIST/"
          cp -r docs "dist/$name/"
          cp requirements.txt README.md "dist/$name/"
          # Do not ship bytecode compiled by this runner.
          find "dist/$name" -name __pycache__ -type d -prune -exec rm -rf {} +

          test -f "dist/$name/$UI_DIST/index.html" || {
            echo "the UI build did not land in the archive" >&2
            exit 1
          }

      # Start the archive itself: /api/config is Python, / is the built UI.
      - name: Check the archive serves
        working-directory: dist/${{ env.NAME }}
        run: |
          pip install --disable-pip-version-check -r requirements.txt
          PYTHONPATH=. python -m buy_agent.server --port "$PORT" > server.log 2>&1 &
          server=$!

          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$PORT/api/config" > /dev/null; then
              break
            fi
            sleep 1
          done

          status=0
          curl -fsS "http://127.0.0.1:$PORT/api/config" > /dev/null || status=1
          curl -fsS "http://127.0.0.1:$PORT/" > /dev/null || status=1
          kill "$server" 2>/dev/null || true

          if [ "$status" -ne 0 ]; then
            echo "the packaged server did not answer:" >&2
            cat server.log >&2
          fi
          rm -f server.log
          exit "$status"

      - name: Pack it
        working-directory: dist
        run: |
          tar -czf "$NAME.tar.gz" "$NAME"
          zip -qr "$NAME.zip" "$NAME"
          sha256sum "$NAME.tar.gz" "$NAME.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # --clobber lets a re-run replace the assets.
      - name: Upload the assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            "dist/$NAME.tar.gz" "dist/$NAME.zip" dist/SHA256SUMS.txt \
            --clobber --repo "$GITHUB_REPOSITORY"

  image:
    # The web tier as an image (ADR-0015); nothing else builds the Dockerfile.
    name: Container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Log in to ghcr.io
        run: echo "${{ github.token }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build the image
        run: |
          # Registry paths are lowercase.
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${TAG#v}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

          docker build -t "$image:$version" .

      # Smoke-test the image before publishing it.
      - name: Check the image serves
        run: |
          docker run --rm -d -p 8000:8000 --name buy-agent-smoke "$IMAGE:$VERSION"

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/config > /dev/null; then
              break
            fi
            sleep 1
          done

          status=0
          curl -fsS http://127.0.0.1:8000/api/config > /dev/null || status=1
          curl -fsS http://127.0.0.1:8000/ > /dev/null || status=1
          if [ "$status" -ne 0 ]; then
            echo "the image did not serve:" >&2
            docker logs buy-agent-smoke >&2
          fi
          docker rm -f buy-agent-smoke > /dev/null
          exit "$status"

      # `latest` follows full releases only, never a manual re-run.
      - name: Push it
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          docker push "$IMAGE:$VERSION"

          if [ "$PRERELEASE" = "false" ]; then
            docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
