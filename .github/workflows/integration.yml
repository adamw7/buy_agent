name: Integration tests

on:
  schedule:
    # 03:41 UTC nightly, off the hour.
    - cron: "41 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    # Linux only: the question is whether a real model honours the schema.
    name: pytest integration (Python 3.14, qwen3:0.6b on CPU)
    runs-on: ubuntu-latest
    # Install, pull and inference on four CPU cores, inside five minutes (ADR-0026).
    timeout-minutes: 5
    defaults:
      run:
        # pipefail, so the piped install fails when the download does.
        shell: bash

    env:
      # A missing Ollama fails here rather than skipping; see integration/__init__.py.
      BUY_AGENT_REQUIRE_OLLAMA: "1"
      # Where the run's scorecard is written, as `python -m benchmark --json` writes
      # one; uploaded below pass or fail (ADR-0072).
      BUY_AGENT_SCORECARD: scorecard.json

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Deliberately unpinned and uncached: noticing a release that changes how
      # json_schema decodes is half of what this job is for.
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          # The install script may already have started a service.
          if ! curl -fsS http://localhost:11434/api/version >/dev/null 2>&1; then
            ollama serve > ollama.log 2>&1 &
          fi
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:11434/api/version; then
              exit 0
            fi
            sleep 1
          done
          echo "Ollama did not answer on :11434 within 30s" >&2
          exit 1

      # The tag integration/__init__.py names, held by tests/test_conventions.py.
      - name: Pull the model
        run: ollama pull qwen3:0.6b

      - name: Run the integration tests
        run: python -m pytest integration

      # The one scheduled measurement of a real model, and the baseline the next
      # change is compared against: kept on a green night as on a red one.
      - name: Upload the scorecard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scorecard
          path: scorecard.json
          if-no-files-found: ignore

      - name: Upload the Ollama log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ollama-log
          path: ollama.log
          if-no-files-found: ignore
