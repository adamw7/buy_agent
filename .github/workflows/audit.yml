name: Dependency audit

on:
  # ADR-0062: the review gates what a pull request adds; the audit runs on a
  # schedule, since a new advisory is not news a push made true.
  pull_request:
  schedule:
    # 02:47 UTC nightly, off the hour and off the other schedules (ADR-0061).
    - cron: "47 2 * * *"
  workflow_dispatch:

concurrency:
  # The event is in the group, as in ci.yml.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: pip-audit and npm audit
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Guards a resolver waiting on a registry that stopped answering.
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          # The audited files are resolved, not installed, so only this one is cached.
          cache-dependency-path: requirements-audit.txt

      - name: Install the auditor
        run: pip install -r requirements-audit.txt

      # Every list but requirements-ap2.txt, which is installed --no-deps, so its
      # metadata pins describe nothing installed (ADR-0046). No severity threshold.
      - name: Audit the Python dependencies
        run: |
          python -m pip_audit --progress-spinner off \
            -r requirements.txt \
            -r requirements-dev.txt \
            -r requirements-mutation.txt \
            -r requirements-ap2-deps.txt \
            -r requirements-screenshots.txt \
            -r requirements-audit.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"

      # Reads the lockfile, so no npm ci. `high`, since the lockfile is mostly
      # build-time transitives. Runs even if the step above failed.
      - name: Audit the UI dependencies
        if: ${{ !cancelled() }}
        working-directory: ui
        run: npm audit --audit-level=high

  review:
    # Gates a merge on what the branch adds, at the threshold above; neither tool
    # reads the other's, so tests/test_conventions.py holds them together.
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
