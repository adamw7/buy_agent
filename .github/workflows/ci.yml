name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 04:09 UTC on Saturdays: the Windows half of the matrix, which no push and no
    # pull request runs any more (ADR-0037). Off the hour for the reason the other
    # two schedules are -- runs queued at :00 can start an hour late -- and off
    # mutation.yml's 05:17 so the two weekly jobs are not both waiting on runners.
    # GitHub only schedules workflows that are on the default branch, so this fires
    # once it is on main.
    - cron: "9 4 * * 6"
  workflow_dispatch:

concurrency:
  # The event is part of the group so the weekly Windows run and a push to main are
  # not each other's to cancel: both are on refs/heads/main, and cancel-in-progress
  # would otherwise let a Saturday morning merge silently drop the run that is the
  # only Windows check there is.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Both jobs run the tests and read nothing else: no release to upload, no image
# to push, no comment to post. The other three workflows say so already, and a
# job that asks for nothing cannot be talked into using more than it asked for.
permissions:
  contents: read

jobs:
  test:
    # Development happens on Windows and the runners are Linux, so both are run --
    # a platform difference either one hides is one nobody sees until it is the
    # only machine left -- but not on the same schedule (ADR-0037): Linux gates
    # every push and pull request, Windows runs weekly and on a manual run, which
    # is also how to ask for it on a branch. fail-fast is off so a failure on one
    # platform still reports the other on the runs that have both.
    name: pytest (Python 3.13, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    defaults:
      run:
        # One shell on both runners. PowerShell is the default on Windows, and a
        # step of several commands there carries on past a failing one. It is not
        # the Linux default either: `shell: bash` is `bash -eo pipefail`, where
        # the default is `bash -e` and a failing command mid-pipeline is ignored.
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m coverage run -m pytest

      - name: Check coverage
        run: python -m coverage report

  ui:
    name: ng test (Node 22, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    defaults:
      run:
        shell: bash
        working-directory: ui

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:coverage

      - name: Build
        run: npm run build
