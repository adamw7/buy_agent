name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Saturdays 04:09 UTC: the Windows half (ADR-0037), off the hour and off
    # mutation.yml's 05:17.
    - cron: "9 4 * * 6"
  workflow_dispatch:

concurrency:
  # The event is in the group so a push to main cannot cancel the weekly Windows run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Linux gates every push and pull request; Windows joins weekly and on dispatch
    # (ADR-0037).
    name: pytest (Python 3.14, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    defaults:
      run:
        # bash -eo pipefail on both runners, rather than PowerShell or plain bash -e.
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          # Every file the install steps hand pip, so no cache outlives a bump.
          cache-dependency-path: |
            requirements-dev.txt
            requirements.txt
            requirements-ap2-deps.txt
            requirements-ap2.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # --no-deps is not per-line, so the SDK's own imports are a file of their own.
      - name: Install the AP2 SDK
        run: |
          pip install -r requirements-ap2-deps.txt
          pip install --no-deps -r requirements-ap2.txt

      # Three workers, each measured: the runner is two cores of two threads, and three
      # beat two and four on every one timed. pytest-cov combines them, prints the table
      # and fails the step under .coveragerc's floor (ADR-0076).
      - name: Run tests
        run: python -m pytest -n 3 --cov

      # Lint and type-check last: the tests are what a change is about (ADR-0048,
      # ADR-0063).
      - name: Run pylint
        run: python -m pylint buy_agent

      # mypy checks its cache against the files themselves, so a stale one costs time
      # and never an answer; it is keyed on what moves the third-party half of it, the
      # files the install steps hand pip, and on the settings in setup.cfg (ADR-0076).
      - name: Restore mypy's cache
        uses: actions/cache@v6
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('requirements-dev.txt', 'requirements.txt', 'requirements-ap2-deps.txt', 'requirements-ap2.txt', 'setup.cfg') }}

      - name: Run mypy
        run: python -m mypy buy_agent

  ui:
    name: ng test (Node 24, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    defaults:
      run:
        shell: bash
        working-directory: ui

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # Last for the same reason; includes the CSP's template rule (ADR-0066).
      - name: Run eslint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check
