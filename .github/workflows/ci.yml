name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Saturdays 04:09 UTC: the Windows half (ADR-0037), off the hour and off
    # mutation.yml's 05:17.
    - cron: "9 4 * * 6"
  workflow_dispatch:

concurrency:
  # The event is in the group so a push to main cannot cancel the weekly Windows run.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Linux gates every push and pull request; Windows joins weekly and on dispatch
    # (ADR-0037).
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    defaults:
      run:
        # bash -eo pipefail on both runners, rather than PowerShell or plain bash -e.
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          # Every file the install steps hand pip, so no cache outlives a bump.
          cache-dependency-path: |
            requirements-dev.txt
            requirements.txt
            requirements-ap2-deps.txt
            requirements-ap2.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # --no-deps is not per-line, so the SDK's own imports are a file of their own.
      - name: Install the AP2 SDK
        run: |
          pip install -r requirements-ap2-deps.txt
          pip install --no-deps -r requirements-ap2.txt

      # mypy checks its cache against the files themselves, so a stale one costs time
      # and never an answer; it is keyed on what moves the third-party half of it, the
      # files the install steps hand pip, and on the settings in setup.cfg (ADR-0076).
      - name: Restore mypy's cache
        uses: actions/cache@v6
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('requirements-dev.txt', 'requirements.txt', 'requirements-ap2-deps.txt', 'requirements-ap2.txt', 'setup.cfg') }}

      # The checks are the script's, so a contributor's gate is this one (ADR-0091):
      # pytest in three workers with the coverage floor (ADR-0076), then pylint and
      # mypy (ADR-0048, ADR-0063).
      - name: Run the gate
        shell: pwsh
        run: ./scripts/preflight.ps1 -Only python

  ui:
    name: ng test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    defaults:
      run:
        shell: bash
        working-directory: ui

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The specs with their floor, the build, then eslint with the CSP's template rule
      # (ADR-0066) and Prettier: the script's, as in the test job (ADR-0091).
      - name: Run the gate
        shell: pwsh
        run: ../scripts/preflight.ps1 -Only ui

      # The build the browser job opens, so it is the one these checks passed (ADR-0087).
      - name: Keep the build
        uses: actions/upload-artifact@v7
        with:
          name: ui-build-${{ matrix.os }}
          path: ui/dist/ui/browser
          if-no-files-found: error
          retention-days: 1

  browser:
    # The ui job's build in Chromium, behind the real server and its CSP: what jsdom
    # never runs and only a browser refuses (ADR-0087).
    name: browser (Chromium, ${{ matrix.os }})
    needs: ui
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest"]') }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ui-build-${{ matrix.os }}
          path: ui/dist/ui/browser

      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements.txt
            requirements-screenshots.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Playwright
        run: pip install -r requirements-screenshots.txt

      # The headless shell screenshots.INSTALL names, with the libraries Linux lacks.
      - name: Install Chromium
        run: python -m playwright install --only-shell --with-deps chromium

      # Outside testpaths, like integration/; a missing browser fails rather than skips.
      - name: Run the gate
        shell: pwsh
        run: ./scripts/preflight.ps1 -Only browser
        env:
          BUY_AGENT_REQUIRE_BROWSER: "1"
