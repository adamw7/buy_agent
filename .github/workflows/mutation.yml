name: Mutation testing

on:
  schedule:
    # 05:17 UTC on Saturdays, off the hour.
    - cron: "17 5 * * 6"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutmut:
    name: mutmut (Python 3.14)
    runs-on: ubuntu-latest
    # A run is a couple of minutes; the hour guards a hung mutant.
    timeout-minutes: 60
    defaults:
      run:
        # pipefail, so the report's pipe fails with its left-hand side.
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-mutation.txt
            requirements-dev.txt
            requirements.txt
            requirements-ap2-deps.txt
            requirements-ap2.txt

      - name: Install dependencies
        run: pip install -r requirements-mutation.txt

      # The payment tests need the SDK, as in ci.yml.
      - name: Install the AP2 SDK
        run: |
          pip install -r requirements-ap2-deps.txt
          pip install --no-deps -r requirements-ap2.txt

      # Settings are in setup.cfg; the floor in scripts/mutation_report.py fails the job.
      - name: Run mutation testing
        run: python -m mutmut run

      - name: Collect the results
        if: always()
        run: python -m mutmut results --all true > mutation-results.txt

      - name: Report
        if: always()
        run: python scripts/mutation_report.py mutation-results.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-results
          path: mutation-results.txt
