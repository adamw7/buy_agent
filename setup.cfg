# Settings for mutmut, the mutation tester `.github/workflows/mutation.yml` runs
# every Saturday. This is not a packaging file -- the project is run from a
# checkout and never installed, which is why there is no pyproject.toml and no
# setup.py -- but setup.cfg is where mutmut looks for its configuration.
[mutmut]
source_paths = buy_agent

# A run copies the tree to mutants/ and tests the copy, taking tests/ and this
# file along by itself. Everything else the suite reaches for has to be named
# here: pytest.ini carries `pythonpath = .`, without which neither the copied
# package nor scripts/ imports, tests/test_conventions.py imports integration/
# for the model tag the nightly run has to agree with, and it reads the
# Dockerfile, the two ignore files that decide what a build is shown of it,
# the workflows, the decision log, the coverage and linter settings, the
# TypeScript types and the settings that half is compiled under -- the front end's
# own mutation run among them (ADR-0061) -- off disk rather than through an import,
# and
# tests/test_server.py asks whether the directory the "UI is not built" message
# names really is the Angular workspace, which is package.json and angular.json
# being there, and it reads the skills in .claude/ back against the code they
# walk somebody through and the hook beside them back against what ci.yml
# installs. The files at the top of the tree are named one by one for the same
# reason and a step further from an import: the hook and the preflight skill each
# hand pip a filename, a skill points at CLAUDE.md and the README, and the tests
# hold every one of those to a file that is really there. A file left out is
# missing only in mutants/, so it fails the Saturday run at collection and
# nothing else -- which is why
# tests/test_conventions.py::test_a_mutation_run_copies_everything_the_tests_reach_for
# reads this list back.
also_copy =
    pytest.ini
    .coveragerc
    .pylintrc
    CLAUDE.md
    README.md
    requirements.txt
    requirements-dev.txt
    requirements-ap2.txt
    requirements-ap2-deps.txt
    requirements-mutation.txt
    Dockerfile
    .dockerignore
    .gitignore
    docs/
    scripts/
    integration/
    benchmark/
    demo/
    .github/
    ui/src/app/
    ui/package.json
    ui/angular.json
    ui/tsconfig.json
    ui/tsconfig.app.json
    ui/tsconfig.mutation.json
    ui/stryker.config.mjs
    .claude/skills/
    .claude/hooks/


# Settings for mypy, the type checker `.github/workflows/ci.yml` runs over
# `buy_agent/` beside pylint (ADR-0063). The same argument puts it here as puts
# mutmut's settings above: the project is run from a checkout and never installed,
# so there is no pyproject.toml for either of them to live in.
#
# The package is annotated throughout and nothing read those annotations, which made
# them prose that happens to parse -- and a `# type: ignore[arg-type]` in `api.py`
# written for a checker no command ran, which is exactly what ADR-0048 says the
# `# noqa` codes had become.
[mypy]
# The default checks and not `strict`, which is a floor this package can hold today:
# strict pulls in `disallow_untyped_defs`, and the thirty-nine `def`s here that carry
# no return type are mostly the ones a reader gains nothing from. What is added to
# the default is the one check this was noticed through. A `# type: ignore` that has
# stopped being true is a suppression nobody can date, which is the sentence ADR-0048
# writes about `# noqa` and `.pylintrc` answers with `useless-suppression`: this is
# that same rule one tool over, and it is what makes a stale ignore fail rather than
# sit there.
warn_unused_ignores = True

# The libraries neither tool here can read, named for the same reason in both files
# and held together by
# tests/test_conventions.py::test_mypy_and_pylint_name_the_same_unreadable_libraries.
# `.pylintrc` says it as `ignored-modules` and `extension-pkg-allow-list`; mypy says
# it as `ignore_missing_imports`, one section per package since that is the only
# spelling it has.
#
# The AP2 SDK and the two libraries it signs with ship no stubs and no `py.typed`,
# and `mandates.py` defers every one of those imports because a checkout may not have
# them at all (ADR-0046). Left to fail, this would be the one check here that is red
# on a checkout the tests call fine.
[mypy-ap2.*]
ignore_missing_imports = True

[mypy-jwcrypto.*]
ignore_missing_imports = True

[mypy-cryptography.*]
ignore_missing_imports = True

# `lxml`, which `fetch.py` parses pages with, is a C extension shipping no stubs of
# its own. `.pylintrc` answers that with `extension-pkg-allow-list`, which is the same
# sentence in the vocabulary of a tool that can import it and a tool that cannot.
[mypy-lxml.*]
ignore_missing_imports = True
