# Settings for mutmut, the mutation tester `.github/workflows/mutation.yml` runs
# every Saturday. This is not a packaging file -- the project is run from a
# checkout and never installed, which is why there is no pyproject.toml and no
# setup.py -- but setup.cfg is where mutmut looks for its configuration.
[mutmut]
source_paths = buy_agent

# A run copies the tree to mutants/ and tests the copy, taking tests/ and this
# file along by itself. Everything else the suite reaches for has to be named
# here: pytest.ini carries `pythonpath = .`, without which neither the copied
# package nor scripts/ imports, tests/test_conventions.py imports integration/
# for the model tag the nightly run has to agree with, and it reads the
# Dockerfile, the workflows, the decision log, the coverage settings and the
# TypeScript types off disk rather than through an import, and
# tests/test_server.py asks whether the directory the "UI is not built" message
# names really is the Angular workspace, which is package.json and angular.json
# being there. A file left out is
# missing only in mutants/, so it fails the Saturday run at collection and
# nothing else -- which is why
# tests/test_conventions.py::test_a_mutation_run_copies_everything_the_tests_reach_for
# reads this list back.
also_copy =
    pytest.ini
    .coveragerc
    Dockerfile
    docs/
    scripts/
    integration/
    .github/
    ui/src/app/
    ui/package.json
    ui/angular.json
