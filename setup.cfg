# mutmut (mutation.yml, weekly) and mypy (ci.yml) settings. Not a packaging file:
# the project runs from a checkout and is never installed.
[mutmut]
source_paths = buy_agent

# A run tests a copy in mutants/, which carries tests/ and this file by itself.
# Everything else the suite reads -- config, docs, workflows, skills, the hook, the
# UI files the convention tests check -- must be named here, or the Saturday run
# fails at collection. Read back by
# tests/test_conventions.py::test_a_mutation_run_copies_everything_the_tests_reach_for.
also_copy =
    pytest.ini
    .coveragerc
    .pylintrc
    CLAUDE.md
    README.md
    requirements.txt
    requirements-dev.txt
    requirements-ap2.txt
    requirements-ap2-deps.txt
    requirements-screenshots.txt
    requirements-mutation.txt
    requirements-audit.txt
    Dockerfile
    .dockerignore
    .gitignore
    .gitattributes
    docs/
    scripts/
    integration/
    benchmark/
    demo/
    .github/
    ui/src/app/
    ui/src/styles.css
    ui/package.json
    ui/angular.json
    ui/tsconfig.json
    ui/tsconfig.app.json
    ui/tsconfig.mutation.json
    ui/stryker.config.mjs
    ui/eslint.config.mjs
    .claude/skills/
    .claude/hooks/

# mypy (ADR-0063): the default checks plus stale-ignore detection, not `strict`.
[mypy]
warn_unused_ignores = True

# Libraries mypy cannot read, held against `.pylintrc` by
# tests/test_conventions.py::test_mypy_and_pylint_name_the_same_unreadable_libraries:
# the AP2 SDK and what it signs with (ADR-0046), Playwright where it is not
# installed (ADR-0065), and lxml's C extension.
[mypy-ap2.*]
ignore_missing_imports = True

[mypy-jwcrypto.*]
ignore_missing_imports = True

[mypy-cryptography.*]
ignore_missing_imports = True

[mypy-playwright.*]
ignore_missing_imports = True

[mypy-lxml.*]
ignore_missing_imports = True
